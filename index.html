<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rick Fickes | Assiniboia</title>
  <meta name="description" content="Rick Fickes, Progressive Conservative candidate for Assiniboia. More information coming soon.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#0b1d35;color:#fff}
    body{min-height:100vh}
    .hero{min-height:100vh;display:grid;grid-template-columns:48% 52%;overflow:hidden}
    .copy{display:flex;align-items:center;padding:clamp(36px,6vw,96px);background:linear-gradient(135deg,#08182d 0%,#12355d 100%)}
    .inner{max-width:650px}
    .eyebrow{font-size:clamp(14px,1.1vw,18px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.78;margin:0 0 20px}
    h1{font-size:clamp(52px,6.3vw,104px);line-height:.92;letter-spacing:-.045em;margin:0 0 28px}
    .role{font-size:clamp(22px,2.2vw,34px);line-height:1.25;margin:0;max-width:580px}
    .soon{font-size:clamp(17px,1.4vw,22px);line-height:1.5;margin:38px 0 0;opacity:.8}
    .photo{min-height:100vh;background:url('rick-fickes.jpg') center center/cover no-repeat}
    @media (max-width:760px){
      .hero{display:flex;flex-direction:column;min-height:100vh}
      .photo{order:1;min-height:54vh;background-position:58% center}
      .copy{order:2;min-height:46vh;padding:34px 28px 42px;align-items:flex-start}
      h1{font-size:clamp(46px,14vw,70px);margin-bottom:18px}
      .role{font-size:clamp(20px,5.8vw,28px)}
      .soon{margin-top:24px}
      .eyebrow{margin-bottom:14px}
    }
  </style>
</head>
<body>
  <main class="hero">
    <section class="copy">
      <div class="inner">
        <p class="eyebrow">Assiniboia</p>
        <h1>Rick<br>Fickes</h1>
        <p class="role">Progressive Conservative Candidate for Assiniboia</p>
        <p class="soon">More information will be coming soon.</p>
      </div>
    </section>
    <div class="photo" role="img" aria-label="Rick Fickes"></div>
  </main>
</body>
</html>
